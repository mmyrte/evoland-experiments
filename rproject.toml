[project]
name = "evoland-plus-darwin"
r_version = "4.6"

repositories = [
    { alias = "CRAN", url = "https://p3m.dev/cran/latest" },
]

# A list of packages to install and any additional configuration
# Examples:
dependencies = [
    "curl",
    "data.table",
    "DBI",
    "duckdb",
    "glue",
    "lubridate",
    "pxR",
    "tidyverse",
    # too many issues with GDAL linking otherwise
    { name = "terra", force_source = true },
    { name = "sf", force_source = true },
    # dev dependencies
    "devtools",
    "httpgd",
    "languageserver",
    "mirai",
    "quarto",
    "rlang",
    "rmarkdown",
    "writexl",
    "svglite",
    { name = "evoland", git = "https://github.com/ethzplus/evoland-plus/", commit = "08aa38ec0de5ccfb48faacc2ff0a958fccaeedd7", install_suggestions = true },
    "mapview",
    "stars",
    "methods",
    "terra",
    "yaml",
    "mlr3learners",
    "e1071",
    # 2026-09-model-comparison: lulcc, and two packages it only suggests but calls
    "lulcc",
    "gsubfn",
    "caret",
    "future.mirai",
    "ggspatial",
    "viridis",
    # 2026-09-model-comparison: two-panel figures
    "patchwork",
]
