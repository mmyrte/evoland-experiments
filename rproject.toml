[project]
name = "evoland-plus-darwin"
r_version = "4.6"

# A list of repositories to fetch packages from. Order matters: we will try to get a package from each repository in order.
# The alias is only used in this file if you want to specifically require a dependency to come from a certain repository.
# Example: { alias = "PPM", url = "https://packagemanager.posit.co/cran/latest" },
repositories = [
    { alias = "CRAN", url = "https://p3m.dev/cran/__linux__/opensuse156/latest" },
]

# A list of packages to install and any additional configuration
# Examples:
dependencies = [
    "curl",
    "data.table",
    "DBI",
    "duckdb",
    "glue",
    "lubridate",
    "pxR",
    "tidyverse",
    { name = "terra", force_source = true },
    { name = "sf", force_source = true },
    # dev dependencies
    "devtools",
    "httpgd",
    "languageserver",
    "mirai",
    "quarto",
    "rlang",
    "rmarkdown",
    "writexl",
    "svglite",
    # NOTE: tracks an unmerged branch, deliberately. Two fixes this pipeline needs are
    # not on main yet:
    #   - `bugfix/regular-period-lengths` (753e489): makes the last period a full decade;
    #     without it period 8 is 2055-2060 and any rate applied to it is doubled.
    #   - claude/ssp-ch-2026-05-tasks-4bfq0t (a5b1814): makes period-specific predictor
    #     slices win over the id_period = 0 fallback, which the CH2025 -gwl projections
    #     in 02-ingest-preds-ch2025-3-gwl.qmd depend on.
    # Move to a plain main commit once both are merged.
    { name = "evoland", git = "https://github.com/ethzplus/evoland-plus/", commit = "a5b1814", install_suggestions = true },
    "mapview",
    "stars",
    "methods",
    "terra",
]
