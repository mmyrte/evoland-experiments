[project]
name = "evoland-plus-darwin"
r_version = "4.6"

# A list of repositories to fetch packages from. Order matters: we will try to get a package from each repository in order.
# The alias is only used in this file if you want to specifically require a dependency to come from a certain repository.
# Example: { alias = "PPM", url = "https://packagemanager.posit.co/cran/latest" },
repositories = [
    { alias = "CRAN", url = "https://stat.ethz.ch/CRAN/" },
]

# A list of packages to install and any additional configuration
# Examples:
dependencies = [
    "curl",
    "data.table",
    "DBI",
    "duckdb",
    "glue",
    "lubridate",
    "pxR",
    "tidyverse",
    # dev dependencies
    "devtools",
    "httpgd",
    "languageserver",
    "mirai",
    "quarto",
    "rlang",
    "rmarkdown",
    "writexl",
    { name = "evoland", git = "https://github.com/ethzplus/evoland-plus/", commit = "a8b0750ca01e3e29a248392ba3baaed2fa5d00d7", install_suggestions = true },
    # { name = "evoland", path = "../evoland-plus-darwin" , install_suggestions = true },
]
