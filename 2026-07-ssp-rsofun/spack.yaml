# Spack environment replicating the evoland-experiments R toolchain on HPC.
# Generated from rv.lock (rv project "evoland-plus-darwin", R 4.5, 222 packages).
#
# WHAT THIS COVERS
#   - r@4.5 and the build toolchain (gfortran/g++ for rsofun & rsplash native code).
#   - Every CRAN package pinned in rv.lock, as `r-<name>` (name lowercased, "." -> "-").
#     The 6 base-R "recommended" packages in the lock (KernSmooth, MASS, Matrix, class,
#     codetools, lattice) are omitted: Spack's `r` already bundles them.
#   - System libraries (GDAL/GEOS/PROJ/libcurl/...) come in automatically as
#     dependencies of r-sf / r-terra / r-stars / r-curl; listed explicitly below only
#     so a site can pin external providers via packages.yaml.
#
# NOT COVERED BY SPACK (install after activating the env, see hpc-setup.md):
#   - evoland   : git ethzplus/evoland-plus @ b40175fd (rproject.toml pin)
#   - rsofun    : git mmyrte/rsofun (the P-model/SPLASH/BiomeE engine)
#   - rsplash   : git mmyrte/rsplash (if used standalone)
#
# EXACT VERSIONS: Spack picks its own package versions, which will not match rv.lock
# exactly. If you need the pinned versions, use the HYBRID in hpc-setup.md: Spack for
# R + toolchain + system libs, then `rv sync` to install the locked CRAN packages.
#
# Any `r-*` below that `spack concretize` reports as missing is not yet packaged in
# Spack -> drop it here and install it via rv/install.packages into the project library
# (or add a custom package.py). See hpc-setup.md.
spack:
  concretizer:
    unify: true
  view: true
  specs:
    # --- interpreter + toolchain -------------------------------------------------
    - r@4.5
    - gmake
    # rsofun/rsplash compile Fortran & C++: build the R stack with a gcc that has
    # gfortran (set in the site compilers.yaml, e.g. `%gcc@12`).
    # --- system libraries (usually auto-pulled; here for explicit external pinning) -
    - gdal
    - geos
    - proj
    - sqlite
    - udunits
    - curl
    # --- CRAN packages from rv.lock (r-<name>) ----------------------------------
    - r-asioheaders
    - r-dbi
