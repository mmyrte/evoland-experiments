# Spack environment replicating the evoland-experiments R toolchain on HPC.
# Generated from rv.lock (rv project "evoland-plus-darwin", R 4.5) and FILTERED against
# this site's Spack catalog (2026-07-ssp-rsofun/spack-available.txt): of the 215 CRAN
# packages in the lock, 189 are packaged here and listed below. The remaining 26 are not
# in this Spack -> install them with `Rscript 2026-07-ssp-rsofun/install-missing.R` after
# `spack install` (see hpc-setup.md). The 6 base-R recommended packages are bundled by `r`.
#
# NOT in Spack (git installs, post-activation): evoland (ethzplus/evoland-plus@b40175fd),
# rsofun (mmyrte/rsofun), rsplash (mmyrte/rsplash). rsofun/rsplash need gfortran.
#
# Spack picks its own package versions (not the exact rv.lock pins). For version-exact
# reproduction use the hybrid in hpc-setup.md (Spack toolchain + `rv sync`).
