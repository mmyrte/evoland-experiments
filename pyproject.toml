[project]
name = "evoland-experiments"
version = "0.0.0"
description = "Python side of the evoland experiments (CLUinPy for 2026-09-model-comparison)"
requires-python = ">=3.11,<3.13"
dependencies = [
    # CLUinPy (nomisthomsen/CLUinPy, cloned separately, see CLUINPY_REPO): its requirements.txt
    # clumpy's Cython extensions (ekde, hyperclip) need the NumPy 1.x C API
    "numpy<2",
    "pandas",
    "scikit-learn",
    "statsmodels",
    "scipy",
    "rasterio",
    "geopandas",
    # xgboost on Linux pulls in NVIDIA's NCCL (several hundred MB); CLUinPy only imports it
    "xgboost-cpu; sys_platform == 'linux'",
    "xgboost; sys_platform != 'linux'",
    "joblib",
    "numba",
    "openpyxl",
    # Python bindings of the system GDAL; built from source against libgdal-dev, so the
    # version has to match `gdal-config --version` (3.8.4 on Ubuntu 24.04)
    "gdal[numpy]==3.8.4",
    # clumpy (mmyrte/clumpy, a fork of Mazy's clumpy): the Bayes-eKDE transition probability
    # estimator, a fifth estimator of 2026-09-model-comparison
    "clumpy",
    "ekde",
    "hyperclip",
]

[tool.uv]
package = false

[tool.uv.sources]
clumpy = { git = "https://github.com/mmyrte/clumpy", rev = "e9f73b9", subdirectory = "clumpy" }
ekde = { git = "https://github.com/mmyrte/clumpy", rev = "e9f73b9", subdirectory = "ekde" }
hyperclip = { git = "https://github.com/mmyrte/clumpy", rev = "e9f73b9", subdirectory = "hyperclip" }

[tool.uv.extra-build-dependencies]
# the GDAL bindings need numpy (for gdal_array) and setuptools at build time
gdal = ["setuptools", "numpy<2"]
ekde = ["setuptools", "numpy<2", "cython"]
hyperclip = ["setuptools", "numpy<2", "cython"]
